<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141923" />
      <stop offset="100%" stop-color="#080A0F" />
    </linearGradient>

    <!-- Lime Core Gradient -->
    <linearGradient id="limeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDFF33" />
      <stop offset="50%" stop-color="#CCFF00" />
      <stop offset="100%" stop-color="#99E600" />
    </linearGradient>

    <!-- Metallic Titanium Gradient -->
    <linearGradient id="titaniumGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#3A4659" />
      <stop offset="50%" stop-color="#222B38" />
      <stop offset="100%" stop-color="#151B24" />
    </linearGradient>

    <!-- Ambient Lime Glow Filter -->
    <filter id="limeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Squircle (Android Adaptive Icon Spec) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" stroke="#263245" stroke-width="6" />

  <!-- Subtle Radial Aura -->
  <circle cx="256" cy="256" r="160" fill="#CCFF00" opacity="0.07" filter="url(#limeGlow)" />

  <!-- Outer Hexagonal Athletic Shield -->
  <polygon points="256,76 396,156 396,316 256,396 116,316 116,156" 
           fill="url(#titaniumGrad)" 
           stroke="#344256" 
           stroke-width="5" 
           stroke-linejoin="round" />

  <!-- Inner Hexagonal Inset Border -->
  <polygon points="256,98 376,168 376,308 256,378 136,308 136,168" 
           fill="none" 
           stroke="#CCFF00" 
           stroke-width="3" 
           stroke-opacity="0.35" 
           stroke-dasharray="14 6" />

  <!-- Central Interlocking Barbell & G-Glyph Geometry -->
  <!-- Left Weight Plate -->
  <rect x="174" y="186" width="22" height="140" rx="7" fill="#1C2430" stroke="#CCFF00" stroke-width="4.5" />
  <rect x="160" y="206" width="14" height="100" rx="5" fill="#151C26" stroke="#485973" stroke-width="3.5" />

  <!-- Right Weight Plate -->
  <rect x="316" y="186" width="22" height="140" rx="7" fill="#1C2430" stroke="#CCFF00" stroke-width="4.5" />
  <rect x="338" y="206" width="14" height="100" rx="5" fill="#151C26" stroke="#485973" stroke-width="3.5" />

  <!-- Center Shaft Bar -->
  <rect x="196" y="246" width="120" height="20" rx="4" fill="#3A485C" stroke="#252F3E" stroke-width="2" />

  <!-- Signature Electric Lime 'G' Monogram Chevron -->
  <path d="M 276 196 
           L 226 196 
           A 32 32 0 0 0 194 228 
           L 194 284 
           A 32 32 0 0 0 226 316 
           L 278 316 
           A 12 12 0 0 0 290 304 
           L 290 262 
           L 250 262 
           L 250 278 
           L 272 278 
           L 272 298 
           L 228 298 
           A 14 14 0 0 1 214 284 
           L 214 228 
           A 14 14 0 0 1 228 214 
           L 276 214 
           Z" 
        fill="url(#limeGrad)" 
        filter="url(#limeGlow)" />

  <!-- Precision High-Tech Accent Nodes -->
  <circle cx="256" cy="120" r="5" fill="#00E5FF" />
  <circle cx="360" cy="180" r="4" fill="#CCFF00" />
  <circle cx="152" cy="180" r="4" fill="#CCFF00" />
  <circle cx="256" cy="360" r="5" fill="#00E5FF" />

  <!-- Branding Label Below Shield -->
  <text x="256" y="440" 
        text-anchor="middle" 
        font-family="'Vazirmatn', 'Montserrat', -apple-system, sans-serif" 
        font-size="34" 
        font-weight="900" 
        letter-spacing="9" 
        fill="#F4F6F8">GYMBRO</text>
  
  <text x="256" y="468" 
        text-anchor="middle" 
        font-family="'Vazirmatn', 'Montserrat', -apple-system, sans-serif" 
        font-size="12" 
        font-weight="800" 
        letter-spacing="4" 
        fill="#CCFF00">PRO ATHLETIC SUITE</text>
</svg>
